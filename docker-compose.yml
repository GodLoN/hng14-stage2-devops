version: '3.8'

services:
  redis:
    image: redis:alpine
    networks:
      - backend-nw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-nw
      - frontend-nw
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  worker:
    build: ./worker
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-nw
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-nw
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  frontend-nw:
  backend-nw:
    internal: true # Redis is hidden from the host!
